<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedah 3 Raja Batu Bara · BYAN, ADRO, BUMI</title>
<meta name="description" content="Dashboard interaktif profitabilitas, solvabilitas, dan diagnosis BYAN, ADRO, dan BUMI 2021–2025.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0E0E11;--panel:#141418;--card:#1C1C22;--line:#26262E;--txt:#E7E7EA;--mut:#A3A3AD;--dim:#8E8E99}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.top{font-size:11px;letter-spacing:2.4px;color:var(--mut);font-weight:600;margin:4px 2px 14px}
.wrap{background:var(--panel);border:1px solid #2A2A32;border-radius:20px;padding:18px}
.cos{display:flex;gap:8px;margin-bottom:14px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.co{min-height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:600;background:var(--card);color:var(--mut);border:1px solid #33333C}
.co[aria-pressed="true"]{background:#E7E7EA;color:#141418;border-color:#E7E7EA}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.nm{font-size:19px;font-weight:700;color:#fff}
.sb{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.4}
.tg{flex:none;font-size:11.5px;padding:5px 11px;border-radius:999px;font-weight:600;white-space:nowrap}
.cg{background:#12352D;color:#2BB89B}.cy{background:#3A2B18;color:#E0B04A}.cr{background:#3A1818;color:#F08A8A}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.tab{min-height:44px;border-radius:999px;font-size:14px;font-weight:500;background:#22222A;color:var(--mut);border:1px solid #2E2E38}
.tab[aria-selected="true"]{background:#2E2E38;color:#fff;border-color:#6B6B75;font-weight:600}
.ct{font-size:11px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:8px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#CECED6;margin-bottom:4px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:3px;border-radius:2px;display:inline-block}
.sw.d{height:0;border-top:3px dashed;background:none}
.ax{font-size:11.5px;color:#6B6B75;margin-bottom:2px}
svg{display:block;width:100%;height:auto}
.note{font-size:13.5px;color:#CECED6;background:var(--card);border-left:3px solid #D4A332;padding:10px 12px;border-radius:0 10px 10px 0;margin:10px 0 14px;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;padding:13px 14px;border-bottom:3px solid}
.cl{font-size:12px;color:var(--mut);margin-bottom:3px}
.cv{font-size:26px;font-weight:700;color:#fff;letter-spacing:-.5px}
.cn{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.4}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid #22222A}
.rl{font-size:13.5px;color:#CECED6;font-weight:500;padding-top:2px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:4px}
.rt{font-size:13.5px;color:var(--mut);line-height:1.45}
.vd{margin-top:14px;background:#E7E7EA;color:#0E0E11;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:600;line-height:1.45}
.vd b{display:block;font-size:11px;letter-spacing:2px;color:#4A4A52;margin-bottom:4px}
.src{font-size:11.5px;color:#6B6B75;margin-top:16px;line-height:1.55}
.disc{font-size:12px;color:var(--dim);text-align:center;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<main>
<div class="top">BEDAH 3 RAJA BATU BARA · FY2021–2025</div>
<div class="wrap" id="app"></div>
<p class="disc">Konten edukasi, bukan ajakan beli/jual. Label diagnosis adalah penilaian penulis berbasis data. DYOR.</p>
</main>
<script>
var Y=['2021','2022','2023','2024','2025'];
var BC={b:'#4A7FD6',y:'#D4A332',t:'#2BB89B',p:'#7B6DD4'};
var D={
BYAN:{name:'Bayan Resources Tbk',sub:'IDX: BYAN · Pengendali: keluarga Low (±62%)',tag:'Net cash · bebas utang',tc:'cg',
prof:{npm:[41.4,46.0,34.6,26.8,22.4],gm:[61.2,67.2,46.5,38.7,32.3],roe:[65.6,114.1,65.8,41.9,29.9],L:80,R:120},
profCards:[['Net profit margin (2025)','22.4%','Turun 4 tahun beruntun dari 46%','b'],['Gross margin (2025)','32.3%','Separuh dari puncak 67,2% (2022)','y'],['ROE (2025)','29.9%','Laba ÷ ekuitas pemilik induk','t'],['ROIC (est. 2025)','~28%','Estimasi, bukan angka LK','p']],
profNote:'ROE 2022 tembus 114%: laba setahun melebihi seluruh ekuitas pemilik. Itu efek boom harga, bukan kondisi normal.',
solv:{der:[30.6,97.7,74.1,52.2,25.2],de:[0,0,20.1,14.6,0],cr:[313,131,142,164,266],L:120,R:350},
solvCards:[['DER total liabilitas (2025)','25.2%','Terendah dalam 5 tahun','b'],['Utang berbunga / ekuitas','0%','Utang bank $338 jt (2024) sudah lunas','y'],['Current ratio (2025)','2.7x','Aset lancar 2,7x kewajiban lancar','t'],['Net cash (2025)','+$575 jt','Kas lebih besar dari utang berbunga','p']],
solvNote:'Lonjakan DER 2022 (98%) bukan utang bank. Isinya mayoritas kewajiban lancar tanpa bunga saat laba boom (pajak terutang dan kewajiban lain).',
diag:[['Profitabilitas','Kuat','cg','NPM 22,4% masih tebal, tapi turun 4 tahun beruntun'],['Efisiensi modal','Sangat kuat','cg','ROE ~30%; tiap $1 aset menghasilkan ~$1 omzet'],['Likuiditas','Sangat kuat','cg','Current ratio 2,7x'],['Leverage','Sangat kuat','cg','Nol utang berbunga akhir 2025, net cash $575 jt'],['Tren','Waspada','cy','Margin & ROE turun sejak 2022; pendapatan ditopang volume, bukan harga'],['Konsentrasi','Waspada','cy','±92% produksi dari Tabang; 100% batu bara thermal'],['Valuasi','Mahal','cr','P/E ~31x, P/B ~9x (harga 16 Sep 2026)']],
verdict:'Neraca benteng, mesin paling efisien. Tapi pasar sudah membayar mahal untuk itu.'},
ADRO:{name:'Alamtri Resources Indonesia',sub:'IDX: ADRO · ex-Adaro Energy',tag:'Post-spinoff · net cash',tc:'cy',
prof:{npm:[23.4,30.8,76.9,66.4,23.9],gm:[44.3,57.4,40.6,42.0,34.0],roe:[22.6,41.4,24.2,28.0,10.0],L:100,R:50},
profCards:[['Net profit margin (2025)','23.9%','Normal lagi setelah distorsi AADI','b'],['Gross margin (2025)','34.0%','Tertinggi dari 3 emiten di 2025','y'],['ROE (2025)','10.0%','Ekuitas gemuk, laba belum mengejar','t'],['ROIC (est. 2025)','~6%','Estimasi, bukan angka LK','p']],
profNote:'NPM 2023–24 terdistorsi pelepasan AADI (Des 2024): laba bisnis yang dilepas masih tercatat, sementara revenue-nya sudah dipisahkan.',
solv:{der:[70.2,65.2,41.4,24.8,36.2],de:[36.0,24.3,19.4,10.8,16.4],cr:[208,217,201,403,256],L:100,R:450},
solvCards:[['DER total liabilitas (2025)','36.2%','Naik lagi dari 24,8% (2024)','b'],['Utang berbunga / ekuitas','16.4%','Utang $580 jt → $821 jt dalam setahun','y'],['Current ratio (2025)','2.6x','Kas + investasi jangka pendek $1,58 miliar','t'],['Net cash (2025)','+$759 jt','Turun dari $1,45 miliar (2024)','p']],
solvNote:'Utang naik lagi ke $1,06 miliar per Mar 2026, seiring aset dalam konstruksi melonjak dari $491 jt (2024) ke $1,29 miliar (2025).',
diag:[['Profitabilitas','Kuat','cg','Margin 2025 tertinggi dari 3 emiten (GM 34%, NPM 23,9%)'],['Efisiensi modal','Lemah','cr','ROE ~10%; tiap $1 aset cuma menghasilkan $0,27 omzet'],['Likuiditas','Sangat kuat','cg','Current ratio 2,6x'],['Leverage','Waspada','cy','Masih net cash, tapi utang naik ±83% dalam 15 bulan untuk proyek baru'],['Tren','Transisi','cy','Mesin lama (AADI) dilepas, mesin baru masih dibangun'],['Valuasi','Murah','cg','P/E ~10x, P/B ~1,0x (harga 21 Agt 2026)']],
verdict:'Kas tebal, lagi ganti mesin. Murah karena pasar belum yakin mesin barunya bakal menghasilkan.'},
BUMI:{name:'Bumi Resources Tbk',sub:'IDX: BUMI · Pengendali: Bakrie & Salim (Mach Energy 45,78%)',tag:'Recovering · net debt',tc:'cr',
prof:{npm:[16.7,28.7,0.65,5.0,5.4],gm:[20.0,20.3,8.2,12.2,17.5],roe:[null,33.3,0.7,4.2,5.0],L:40,R:40},
profCards:[['Net profit margin (2025)','5.4%','Bantalan laba tipis','b'],['Gross margin (2025)','17.5%','Pulih dari 8,2% (2023)','y'],['ROE (2025)','5.0%','Laba ÷ ekuitas pemilik induk','t'],['ROIC (est. 2025)','~2.5%','Estimasi, bukan angka LK','p']],
profNote:'ROE 2021 tidak digambar: ekuitas pemilik induk masih negatif (−$481 jt). ROE 2022 33% tinggi karena basis ekuitas baru dipulihkan.',
solv:{der:[553,59.2,51.5,45.4,46.1],de:[243,8.7,11.0,10.9,15.1],cr:[27,84,90,101,125],L:120,R:150},
solvCards:[['DER total liabilitas (2025)','46.1%','Turun drastis dari 553% (2021)','b'],['Utang berbunga / ekuitas','15.1%','Naik lagi: $246 jt (2022) → $435 jt','y'],['Current ratio (2025)','1.25x','Pertama kali nyaman di atas 1x','t'],['Net debt (2025)','−$316 jt','Satu-satunya dari 3 yang net debt','p']],
solvNote:'Titik 2021 melewati batas grafik (DER 553%, utang berbunga 243% ekuitas). Utang berbunga turun dari $1,57 miliar (2021) ke $246 jt (2022) setelah private placement Bakrie–Salim.',
diag:[['Profitabilitas','Lemah','cr','NPM 5,4%; harga turun sedikit saja laba bisa habis (2023: laba $11 jt)'],['Efisiensi modal','Lemah','cr','ROE ~5% atas ekuitas pemilik induk'],['Likuiditas','Membaik','cy','Current ratio 0,27x (2021) → 1,25x (2025)'],['Leverage','Waspada','cy','Net debt $316 jt, naik ke $419 jt (Mar 2026)'],['Struktur','Waspada','cy','44% ekuitas milik minoritas anak usaha: porsi laba untuk pemegang saham BUMI lebih kecil dari angka konsolidasi'],['Valuasi','Mahal','cr','P/E ~46x, P/B ~2,3x (harga 28 Jul 2026): pasar membayar harapan turnaround']],
verdict:'Sudah keluar ICU, belum siap lari maraton.'}};
var co='BYAN',tab='p';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function chart(S,L,R){var W=360,b=168,t=16,pl=34,pr=36;function X(i){return pl+i*(W-pl-pr)/4}function Yv(v,m){return b-(Math.min(v,m)/m)*(b-t)}
var s='<svg viewBox="0 0 '+W+' 196" role="img" aria-label="Grafik rasio 2021 sampai 2025">';
for(var k=0;k<=4;k++){var y=b-k*(b-t)/4;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#2A2A32" stroke-width="0.6"/><text x="'+(pl-4)+'" y="'+(y+3)+'" fill="#8E8E99" font-size="8.5" text-anchor="end">'+Math.round(L*k/4)+'%</text><text x="'+(W-pr+4)+'" y="'+(y+3)+'" fill="#2BB89B" font-size="8.5">'+Math.round(R*k/4)+(R>150?'%':'%')+'</text>'}
Y.forEach(function(yr,i){s+='<text x="'+X(i)+'" y="'+(b+17)+'" fill="#CECED6" font-size="9.5" text-anchor="middle">'+yr+'</text>'});
S.forEach(function(se){var m=se.ax==='R'?R:L,d='',pen=false;se.v.forEach(function(v,i){if(v===null){pen=false;return}d+=(pen?'L':'M')+X(i)+' '+Yv(v,m)+' ';pen=true});
s+='<path d="'+d+'" fill="none" stroke="'+se.c+'" stroke-width="2.4" '+(se.dash?'stroke-dasharray="5,4"':'')+' stroke-linecap="round" stroke-linejoin="round"/>';
se.v.forEach(function(v,i){if(v===null)return;var y=Yv(v,m);s+='<circle cx="'+X(i)+'" cy="'+y+'" r="3.4" fill="'+se.c+'" stroke="#141418" stroke-width="1.3"/>';if(v>m)s+='<text x="'+(X(i)+6)+'" y="'+(y+(se.dash?12:-4))+'" fill="'+se.c+'" font-size="9" font-weight="600">'+v+'% ↑</text>'})});
return s+'</svg>'}
function legend(S){return '<div class="lg">'+S.map(function(x){return '<span><i class="sw'+(x.dash?' d':'')+'" style="'+(x.dash?'border-color:':'background:')+x.c+'"></i>'+x.n+'</span>'}).join('')+'</div>'}
function cards(C){return '<div class="cards">'+C.map(function(c){return '<div class="card" style="border-color:'+BC[c[3]]+'"><div class="cl">'+esc(c[0])+'</div><div class="cv">'+esc(c[1])+'</div><div class="cn">'+esc(c[2])+'</div></div>'}).join('')+'</div>'}
function render(){var d=D[co],h='<div class="cos" role="group" aria-label="Pilih emiten">';
Object.keys(D).forEach(function(k){h+='<button class="co" data-co="'+k+'" aria-pressed="'+(k===co)+'">'+k+'</button>'});
h+='</div><div class="hd"><div><div class="nm">'+esc(d.name)+'</div><div class="sb">'+esc(d.sub)+'</div></div><div class="tg '+d.tc+'">'+esc(d.tag)+'</div></div>';
h+='<div class="tabs" role="tablist">';[['p','Profitabilitas'],['s','Solvabilitas'],['d','Diagnosis']].forEach(function(x){h+='<button class="tab" role="tab" data-tab="'+x[0]+'" aria-selected="'+(x[0]===tab)+'">'+x[1]+'</button>'});h+='</div>';
if(tab==='p'){var S=[{n:'Net profit margin',v:d.prof.npm,c:'#4A7FD6',ax:'L'},{n:'Gross margin',v:d.prof.gm,c:'#D4A332',dash:1,ax:'L'},{n:'ROE',v:d.prof.roe,c:'#2BB89B',ax:'R'}];
h+='<div class="ct">Rasio profitabilitas 2021–2025</div>'+legend(S)+'<div class="ax">Kiri: margin · Kanan: ROE</div>'+chart(S,d.prof.L,d.prof.R)+'<div class="note">'+esc(d.profNote)+'</div>'+cards(d.profCards)}
else if(tab==='s'){var S2=[{n:'DER (total liabilitas)',v:d.solv.der,c:'#4A7FD6',ax:'L'},{n:'Utang berbunga / ekuitas',v:d.solv.de,c:'#D4A332',dash:1,ax:'L'},{n:'Current ratio',v:d.solv.cr,c:'#2BB89B',ax:'R'}];
h+='<div class="ct">Rasio solvabilitas 2021–2025</div>'+legend(S2)+'<div class="ax">Kiri: DER &amp; utang berbunga · Kanan: current ratio</div>'+chart(S2,d.solv.L,d.solv.R)+'<div class="note">'+esc(d.solvNote)+'</div>'+cards(d.solvCards)}
else{h+='<div class="ct">Diagnosis 2025</div>'+d.diag.map(function(r){return '<div class="row"><div class="rl">'+esc(r[0])+'</div><div><span class="chip '+r[2]+'">'+esc(r[1])+'</span><div class="rt">'+esc(r[3])+'</div></div></div>'}).join('')+'<div class="vd"><b>VERDICT</b>'+esc(d.verdict)+'</div>'}
h+='<div class="src">Neraca: S&amp;P Global via StockAnalysis. Revenue &amp; laba: laporan tahunan, Investing.com, Alpha Spread. ROE = laba pemilik induk ÷ ekuitas pemilik induk akhir tahun. ROIC = estimasi penulis. Valuasi pakai kurs asumsi Rp16.500/USD dan harga pada tanggal tertera.</div>';
document.getElementById('app').innerHTML=h}
document.getElementById('app').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.co){co=b.dataset.co}if(b.dataset.tab){tab=b.dataset.tab}render()});
render();
</script>
</body>
</html>
